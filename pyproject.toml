[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "pdm-system"
version = "0.1.0"
description = "Predictive Maintenance System for Heavy Equipment — Astra Group Portfolio"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Your Name", email = "your.email@binus.ac.id" }
]
keywords = ["predictive-maintenance", "machine-learning", "fastapi", "mlops"]

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Data & ML
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",

    # Config & Validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",

    # MLOps
    "mlflow>=2.16.0",

    # Drift Monitoring
    "evidently>=0.4.30",

    # Persistence
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.0",

    # Dashboard
    "streamlit>=1.38.0",
    "plotly>=5.24.0",

    # HTTP client (dashboard → API)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # for FastAPI TestClient

    # Linting & Formatting
    "ruff>=0.6.0",

    # Type checking
    "mypy>=1.11.0",
    "types-requests>=2.32.0",

    # Security scanning
    "bandit[toml]>=1.7.9",

    # Notebook
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

# ── Ruff (Linter + Formatter) ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # allow function calls in default args (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

# ── Mypy (Type Checker) ────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["notebooks/"]

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]

# ── Bandit (Security Scanner) ──────────────────────────────────────────────
[tool.bandit]
targets = ["src"]
severity = "medium"
confidence = "medium"
skips = ["B101"]  # allow assert statements

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true